<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excluir conta — Mundo das Setas</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1b2e; color: #fff; display: flex; justify-content: center; padding: 24px; }
  main { max-width: 420px; width: 100%; }
  h1 { font-size: 26px; }
  p { color: #c9d3e0; line-height: 1.5; }
  label { display: block; margin: 14px 0 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 0; font-size: 16px; }
  button { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #e04848; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  #msg { margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Excluir minha conta do Mundo das Setas</h1>
  <p>Ao confirmar, apagamos sua conta, seu apelido, seu progresso salvo na nuvem e suas posições no ranking. Isso não pode ser desfeito.</p>
  <p>Você também pode excluir a conta dentro do jogo, em ⚙️ Configurações → Conta.</p>
  <form id="f">
    <label for="email">E-mail da conta</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Excluir conta definitivamente</button>
  </form>
  <div id="msg"></div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = 'Excluindo…';
  try {
    const res = await fetch('/api/account/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
    });
    if (res.status === 204) { msg.textContent = '✅ Conta excluída. Seus dados foram apagados.'; e.target.remove(); return; }
    const body = await res.json().catch(() => ({}));
    msg.textContent = '❌ ' + (body.error || 'Não foi possível excluir. Tente novamente.');
  } catch { msg.textContent = '❌ Sem conexão. Tente novamente.'; }
});
</script>
</body>
</html>
